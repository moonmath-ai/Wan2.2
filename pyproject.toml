[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wan"
version = "2.2.0"
description = "Wan: Open and Advanced Large-Scale Video Generative Models"
authors = [
    { name = "Wan Team", email = "wan.ai@alibabacloud.com" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio",
    "opencv-python>=4.9.0.80",
    "diffusers>=0.31.0",
    "transformers>=4.49.0,<=4.51.3",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio[ffmpeg]",
    "easydict",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    #"flash_attn",
    "numpy>=1.23.5,<2",
]

[project.optional-dependencies]
s2v = [
    "openai-whisper",
    "HyperPyYAML",
    "onnxruntime",
    "inflect",
    "wetext",
    "omegaconf",
    "conformer",
    "hydra-core",
    "lightning",
    "rich",
    "gdown",
    "matplotlib",
    "wget",
    "pyarrow",
    "pyworld",
    "librosa",
    "decord",
    "modelscope",
    "GitPython",
]
animate = [
    "decord",
    "peft",
    "onnxruntime",
    "pandas",
    "matplotlib",
    "sam-2",
    "loguru",
    "sentencepiece",
]
lite = [
    "ninja",
    "packaging",
]

[project.urls]
homepage = "https://wanxai.com"
documentation = "https://github.com/Wan-Video/Wan2.2"
repository = "https://github.com/Wan-Video/Wan2.2"
huggingface = "https://huggingface.co/Wan-AI/"
modelscope = "https://modelscope.cn/organization/Wan-AI"
discord = "https://discord.gg/p5XbdQV7"

[tool.setuptools]
packages = ["wan"]

[tool.setuptools.package-data]
"wan" = ["**/*.py"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "mypy",
    "huggingface-hub[cli]",
]


[tool.pixi.workspace]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
cuda-toolkit = "*"
cxx-compiler = "*"
pytorch-cuda = { version = ">=2.2", channel = "pytorch" }
packaging = "*"
ninja = "*"
pip = "*"

[tool.pixi.pypi-dependencies]
wan = { path = ".", editable = true }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "0e78a118995e66bb27d78518c4bd9a3e95b4e266" }

[tool.pixi.pypi-options]
no-build-isolation = ["flash-attn", "lite-attention"]

[tool.pixi.environments]
default = { features = ["animate", "dev", "lite", "s2v"], solve-group = "default" }

[tool.pixi.tasks]
install-lite-attention = "git -C ./LiteAttention clean -Xf  && pip install --no-build-isolation -e ./LiteAttention/hopper"

[tool.pixi.activation]
env = { CUDA_HOME = "/usr/local/cuda-12.8", LD_LIBRARY_PATH = "/usr/local/cuda/lib64:$LD_LIBRARY_PATH" }
